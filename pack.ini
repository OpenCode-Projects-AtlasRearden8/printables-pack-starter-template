# pack.ini — one small config file for the whole pack.
# When you copy this template into a new free-*-pack repo, edit this file
# and you are done: the build script stamps these values into every
# sheet's recheck-date header block automatically.

[pack]
pack_name = Free Printables Pack
version = 0.1.0
# How long until a sheet should be re-checked for stale advice, in weeks.
# Sheets print a "Recheck after:" date = build date + this number.
recheck_after_weeks = 12
